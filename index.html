<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

</head>


<body>
    <section class="card">


        <div class="header">
            <img class="logo" src="./assets/images/logo1.png" alt="imagen logo">
            <h3>Character Counter</h3>
            <button class="modeswitch"> <img src="./assets/images/iconswitch.png" alt="modeSwitch bottom"></button>
        </div>


        <div class="text">
            <h1>Analyze your text in real-time.</h1>
            <textarea>Design is the silent ambassador of your brand. Simplicity is key to effective communication, creating clarity in every interaction. A great design transforms complex ideas into elegant solutions, making them easy to understand. It blends aesthetics and functionality seamlessly.</textarea>
        </div>


        <div class="options">
            <label>
                <input type="checkbox">Exclude Spaces
            </label>
            <label>
                <input type="checkbox">Set Character Limit
            </label>
          <p>Approx. reading time: &lt; 1 minute</p>
        </div>


        <div class="results">
            <article class="result1">
                <h2>278</h2>
                <p>Total Characters</p>
            </article>
             <article class="result2">
                <h2>39</h2>
                <p>Word Count</p>
            </article> 
            <article class="result3">
                <h2>04<h2>
                <p>Sentence Count</p>
            </article>
        </div>


        <div class="Letter Density">
            <h4>Letter Density</h4>
            <ul>
                <li>
                    <p class="Letter">e</p>
                    <div class="bar">
                        <div class="fill"></div>
                    </div>
                    <p class="porcent">40 (16.06%)</p>
                </li>
                <li>  <p class="Letter">i</p>
                    <div class="bar">
                        <div class="fill"></div>
                    </div>
                    <p class="porcent">29 (11.65%)</p></li>
                <li>  <p class="Letter">t</p>
                    <div class="bar">
                        <div class="fill"></div>
                    </div>
                    <p class="porcent">28 (11.24%)</p></li>
                <li>  <p class="Letter">o</p>
                    <div class="bar">
                        <div class="fill"></div>
                    </div>
                    <p class="porcent">22 (8.84%)</p></li>
                <li>  <p class="Letter">n</p>
                    <div class="bar">
                        <div class="fill"></div>
                    </div>
                    <p class="porcent">21 (8.43%)</p></li>
             </ul>
             <button>See More <img src="./assets/images/iconseemore.png" alt="imagen desplegar boton"></button>



        </div>

    </section>
    
</body>
</html>
